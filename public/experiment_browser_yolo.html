<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Browser YOLOv8n ONNX Runtime Experiment</title>
  <script src="/ort.all.min.js"></script>
  <style>
    body { font-family: monospace; background: #0f172a; color: #f8fafc; padding: 20px; }
    #log { background: #1e293b; padding: 15px; border-radius: 8px; white-space: pre-wrap; font-size: 13px; line-height: 1.5; }
    .canvas-container { display: flex; gap: 20px; margin-top: 15px; }
    canvas { border: 1px solid #334155; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>YOLOv8n ONNX Runtime Web (WASM / CPU) Experiment</h2>
  <div id="status">Initializing experiment...</div>
  <div class="canvas-container">
    <div>
      <h4>Input Canvas (320x240)</h4>
      <canvas id="inputCanvas" width="320" height="240"></canvas>
    </div>
    <div>
      <h4>Detections Canvas</h4>
      <canvas id="outputCanvas" width="320" height="240"></canvas>
    </div>
  </div>
  <h3>Experiment Log</h3>
  <div id="log"></div>

  <script>
    const COCO_CLASSES = [
      'person', 'bicycle', 'car', 'motorcycle', 'airplane', 'bus', 'train', 'truck', 'boat', 'traffic light',
      'fire hydrant', 'stop sign', 'parking meter', 'bench', 'bird', 'cat', 'dog', 'horse', 'sheep', 'cow',
      'elephant', 'bear', 'zebra', 'giraffe', 'backpack', 'umbrella', 'handbag', 'tie', 'suitcase', 'frisbee',
      'skis', 'snowboard', 'sports ball', 'kite', 'baseball bat', 'baseball glove', 'skateboard', 'surfboard',
      'tennis racket', 'bottle', 'wine glass', 'cup', 'fork', 'knife', 'spoon', 'bowl', 'banana', 'apple',
      'sandwich', 'orange', 'broccoli', 'carrot', 'hot dog', 'pizza', 'donut', 'cake', 'chair', 'couch',
      'potted plant', 'bed', 'dining table', 'toilet', 'tv', 'laptop', 'mouse', 'remote', 'keyboard', 'cell phone',
      'microwave', 'oven', 'toaster', 'sink', 'refrigerator', 'book', 'clock', 'vase', 'scissors', 'teddy bear',
      'hair drier', 'toothbrush'
    ];

    function log(msg) {
      console.log(msg);
      document.getElementById('log').textContent += msg + '\n';
    }

    async function runExperiment() {
      try {
        log('=== STEP 1: Setting up ONNX Runtime Web environment ===');
        ort.env.wasm.wasmPaths = '/';
        ort.env.wasm.numThreads = 1;
        log('ONNX Runtime Web Version: ' + (ort.version || '1.30.0'));
        log('Execution Provider: WASM (CPU)');

        log('\n=== STEP 2: Loading model yolov8n.onnx ===');
        const loadStart = performance.now();
        const session = await ort.InferenceSession.create('/models/yolov8n.onnx', {
          executionProviders: ['wasm'],
          graphOptimizationLevel: 'all'
        });
        const loadTimeMs = (performance.now() - loadStart).toFixed(2);
        log('Model loaded successfully in ' + loadTimeMs + ' ms');

        log('\n=== STEP 3: Loading reference image (bus.jpg) ===');
        const img = new Image();
        img.crossOrigin = 'anonymous';
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
          img.src = '/test_data/bus.jpg';
        });

        const inCanvas = document.getElementById('inputCanvas');
        const inCtx = inCanvas.getContext('2d');
        inCtx.drawImage(img, 0, 0, 320, 240);
        log('Image rendered to 320x240 canvas');

        log('\n=== STEP 4: Preprocessing canvas image to (1, 3, 320, 320) Tensor ===');
        const imgData = inCtx.getImageData(0, 0, 320, 240);
        const floatData = new Float32Array(1 * 3 * 320 * 320); // zero-initialized

        // Letterbox 320x240 into 320x320 centered (offset y by 40)
        const yOffset = 40;
        const width = 320;
        const height = 240;

        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const pixelIdx = (y * width + x) * 4;
            const r = imgData.data[pixelIdx] / 255.0;
            const g = imgData.data[pixelIdx + 1] / 255.0;
            const b = imgData.data[pixelIdx + 2] / 255.0;

            const targetY = y + yOffset;
            const targetX = x;
            const tensorIdx = targetY * 320 + targetX;

            floatData[0 * 320 * 320 + tensorIdx] = r; // Channel 0: R
            floatData[1 * 320 * 320 + tensorIdx] = g; // Channel 1: G
            floatData[2 * 320 * 320 + tensorIdx] = b; // Channel 2: B
          }
        }

        const inputTensor = new ort.Tensor('float32', floatData, [1, 3, 320, 320]);
        const inputName = session.inputNames[0];
        const feeds = { [inputName]: inputTensor };

        log('\n=== STEP 5: Cold First Inference Run ===');
        const coldStart = performance.now();
        const coldResults = await session.run(feeds);
        const coldLatencyMs = (performance.now() - coldStart).toFixed(2);
        log('Cold Inference Latency: ' + coldLatencyMs + ' ms');

        log('\n=== STEP 6: 10 Warm Consecutive Inference Runs ===');
        const warmLatencies = [];
        for (let i = 1; i <= 10; i++) {
          const t0 = performance.now();
          await session.run(feeds);
          const dt = performance.now() - t0;
          warmLatencies.push(dt);
          log('  Frame ' + i + ': ' + dt.toFixed(2) + ' ms');
        }

        const avgWarmMs = (warmLatencies.reduce((a, b) => a + b, 0) / warmLatencies.length).toFixed(2);
        const minWarmMs = Math.min(...warmLatencies).toFixed(2);
        const maxWarmMs = Math.max(...warmLatencies).toFixed(2);
        const estFps = (1000 / avgWarmMs).toFixed(1);

        log('\n=== STEP 7: Performance Summary ===');
        log('Model Load Time:           ' + loadTimeMs + ' ms');
        log('Cold First Run:            ' + coldLatencyMs + ' ms');
        log('Warm Iterations Avg:       ' + avgWarmMs + ' ms (Min: ' + minWarmMs + ' ms, Max: ' + maxWarmMs + ' ms)');
        log('Estimated Steady-State FPS: ' + estFps + ' FPS');

        log('\n=== STEP 8: Decoding YOLO Output (Postprocessing & NMS) ===');
        const outputName = session.outputNames[0];
        const outputTensor = coldResults[outputName];
        const outData = outputTensor.data; // Shape [1, 84, 2100]
        const numClasses = 80;
        const numBoxes = 2100;

        const rawDetections = [];
        const confThreshold = 0.25;

        for (let i = 0; i < numBoxes; i++) {
          let maxScore = -Infinity;
          let maxClassId = -1;

          for (let c = 0; c < numClasses; c++) {
            const score = outData[(4 + c) * numBoxes + i];
            if (score > maxScore) {
              maxScore = score;
              maxClassId = c;
            }
          }

          if (maxScore > confThreshold) {
            const cx = outData[0 * numBoxes + i];
            const cy = outData[1 * numBoxes + i];
            const w = outData[2 * numBoxes + i];
            const h = outData[3 * numBoxes + i];

            // Re-scale from 320x320 letterbox to 320x240 image
            const x1 = Math.max(0, cx - w / 2);
            const y1 = Math.max(0, (cy - 40) - h / 2);
            const x2 = Math.min(320, cx + w / 2);
            const y2 = Math.min(240, (cy - 40) + h / 2);

            rawDetections.push({
              classId: maxClassId,
              className: COCO_CLASSES[maxClassId],
              confidence: maxScore,
              box: [x1, y1, x2, y2]
            });
          }
        }

        // NMS (Non-Maximum Suppression)
        function calculateIoU(boxA, boxB) {
          const xA = Math.max(boxA[0], boxB[0]);
          const yA = Math.max(boxA[1], boxB[1]);
          const xB = Math.min(boxA[2], boxB[2]);
          const yB = Math.min(boxA[3], boxB[3]);
          const interArea = Math.max(0, xB - xA) * Math.max(0, yB - yA);
          const boxAArea = (boxA[2] - boxA[0]) * (boxA[3] - boxA[1]);
          const boxBArea = (boxB[2] - boxB[0]) * (boxB[3] - boxB[1]);
          return interArea / (boxAArea + boxBArea - interArea);
        }

        rawDetections.sort((a, b) => b.confidence - a.confidence);
        const finalDetections = [];
        const iouThreshold = 0.45;

        for (const det of rawDetections) {
          let keep = true;
          for (const confirmed of finalDetections) {
            if (det.classId === confirmed.classId) {
              if (calculateIoU(det.box, confirmed.box) > iouThreshold) {
                keep = false;
                break;
              }
            }
          }
          if (keep) {
            finalDetections.push(det);
          }
        }

        log('Total Detected Objects: ' + finalDetections.length);
        finalDetections.forEach((d, idx) => {
          log('  [' + (idx + 1) + '] ' + d.className.toUpperCase() + ' (' + (d.confidence * 100).toFixed(1) + '%) -> [' + d.box.map(v => v.toFixed(1)).join(', ') + ']');
        });

        // Draw on output canvas
        const outCanvas = document.getElementById('outputCanvas');
        const outCtx = outCanvas.getContext('2d');
        outCtx.drawImage(inCanvas, 0, 0);

        outCtx.lineWidth = 2;
        outCtx.font = '12px sans-serif';

        for (const d of finalDetections) {
          const [x1, y1, x2, y2] = d.box;
          outCtx.strokeStyle = '#22c55e';
          outCtx.strokeRect(x1, y1, x2 - x1, y2 - y1);
          outCtx.fillStyle = '#22c55e';
          outCtx.fillRect(x1, y1 - 16, outCtx.measureText(d.className).width + 10, 16);
          outCtx.fillStyle = '#000000';
          outCtx.fillText(d.className + ' ' + (d.confidence * 100).toFixed(0) + '%', x1 + 2, y1 - 4);
        }

        window.__EXPERIMENT_RESULTS__ = {
          success: true,
          loadTimeMs: parseFloat(loadTimeMs),
          coldLatencyMs: parseFloat(coldLatencyMs),
          avgWarmMs: parseFloat(avgWarmMs),
          minWarmMs: parseFloat(minWarmMs),
          maxWarmMs: parseFloat(maxWarmMs),
          estFps: parseFloat(estFps),
          detectionsCount: finalDetections.length,
          detections: finalDetections
        };

        document.getElementById('status').innerHTML = '<span style="color: #22c55e; font-weight: bold;">Experiment Complete! Avg Inference: ' + avgWarmMs + ' ms (' + estFps + ' FPS)</span>';
      } catch (err) {
        log('ERROR: ' + err.message);
        console.error(err);
        window.__EXPERIMENT_RESULTS__ = { success: false, error: err.message };
        document.getElementById('status').innerHTML = '<span style="color: #ef4444; font-weight: bold;">Experiment Failed: ' + err.message + '</span>';
      }
    }

    window.addEventListener('DOMContentLoaded', runExperiment);
  </script>
</body>
</html>
